<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Etymon</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: #16120c; color: #f3ead8; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    img { width: 96px; height: 96px; border-radius: 20px; }
    h1 { margin: 16px 0 8px; }
    p { color: #b9a988; margin: 0 0 20px; }
    button {
      font: inherit; font-weight: 700; padding: 10px 18px; border: 0; border-radius: 6px;
      background: #f2b64a; color: #241805; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Etymon needs a connection to play. Check yours and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
